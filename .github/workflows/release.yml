# Publishes a release when a version tag (v1.2.3) is pushed: checks the tag matches
# package.json, runs the tests again, and creates the GitHub release with notes from
# lib/changelog.js and a source archive. Installs then pick it up automatically.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The tag matches package.json
        run: |
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME but package.json says $WANT"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Notes and archive
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > notes.md
          git archive --format=tar.gz --prefix="serverboy-$GITHUB_REF_NAME/" -o "serverboy-$GITHUB_REF_NAME.tar.gz" HEAD
          sha256sum "serverboy-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Serverboy $GITHUB_REF_NAME" --notes-file notes.md "serverboy-$GITHUB_REF_NAME.tar.gz" SHA256SUMS
