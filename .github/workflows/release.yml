# Publishes a release when a version tag (v1.2.3) is pushed, or when started by hand
# (Actions → Release → Run workflow, version v1.2.3): checks the version matches package.json,
# runs the tests again, and creates the GitHub release (and the tag, if it does not exist yet)
# with notes from lib/changelog.js and a source archive. Installs then pick it up automatically.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, like v1.7.0 (must match package.json on the chosen branch)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The version matches package.json
        run: |
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$VERSION" ]; then echo "Asked to publish $VERSION but package.json says $WANT"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Notes and archive
        run: |
          node scripts/release-notes.js "$VERSION" > notes.md
          git archive --format=tar.gz --prefix="serverboy-$VERSION/" -o "serverboy-$VERSION.tar.gz" HEAD
          sha256sum "serverboy-$VERSION.tar.gz" > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag on this exact commit when started by hand.
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "Serverboy $VERSION" --notes-file notes.md "serverboy-$VERSION.tar.gz" SHA256SUMS
